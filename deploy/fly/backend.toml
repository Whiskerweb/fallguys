# Fly.io — le backend. Prive : aucun port public, le serveur de jeu le joint par le reseau
# interne de Fly (http://<app>.internal:8787). Une machine, jamais deux, jamais eteinte.
app = "tumble-bg-backend"
primary_region = "cdg"

[build]
  dockerfile = "../../backend/Dockerfile"

[env]
  PORT = "8787"
  # Le reseau vient du .env par deployer.sh (secret ROBINHOOD_RESEAU) : une seule source, le
  # jour du passage en mainnet on change le .env et rien ici.

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
