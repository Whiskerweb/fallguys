# Fly.io — le serveur de jeu, public, WebSockets comprises. Une machine allumee en
# permanence : une partie de seize joueurs vit dans sa memoire.
app = "tumble-bg-jeu"
primary_region = "cdg"

[build]
  dockerfile = "../jeu.Dockerfile"

[env]
  SERVEUR_PORT = "8080"
  POLITIQUE = "PRODUCTION"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
